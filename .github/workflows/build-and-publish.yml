name: Build & Publish agent skills

# Checks the plugin (scripts/check.sh) and, on merge to main, publishes zips of it to S3.
#
# The repo root is the plugin for every agent (Claude Code, GitHub Copilot CLI, Gemini CLI),
# and skills/salto/ is the one skill folder. The zips keep the names and the skill paths of
# the old per-agent bundles: claude.zip, copilot-plugin.zip and gemini.zip hold the plugin
# manifests + skills/salto/; copilot.zip holds .github/skills/salto/ (repo-level Copilot skill).
#
# Publishes to s3://<S3_BUCKET>/<S3_PREFIX>/<version>/ and s3://<S3_BUCKET>/<S3_PREFIX>/latest/.
#
# Required GitHub config (Settings -> Secrets and variables -> Actions):
#   Variables:
#     AWS_REGION   - region of the bucket, e.g. us-east-1            [required]
#     S3_BUCKET    - override target bucket   (default: salto-saas-cli)
#     S3_PREFIX    - override key prefix      (default: salto-agent-plugin)
#   Secrets:
#     AWS_ACCESS_KEY_ID
#     AWS_SECRET_ACCESS_KEY

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin files
        run: ./scripts/check.sh

      - name: Package per-agent zips + manifest
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version .claude-plugin/plugin.json)
          stage=$(mktemp -d)
          mkdir -p out "$stage/plugin" "$stage/copilot/.github/skills"
          cp -R .claude-plugin gemini-extension.json skills "$stage/plugin/"
          cp -R skills/salto "$stage/copilot/.github/skills/salto"
          for agent in claude copilot-plugin gemini; do
            ( cd "$stage/plugin" && zip -qr "$GITHUB_WORKSPACE/out/${agent}.zip" . )
          done
          ( cd "$stage/copilot" && zip -qr "$GITHUB_WORKSPACE/out/copilot.zip" . )
          AGENTS=(claude copilot-plugin copilot gemini)
          printf '%s\n' "${AGENTS[@]}" | jq -R . | jq -s \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg builtAt "$(date -u +%FT%TZ)" \
            '{version: $version, commit: $commit, builtAt: $builtAt, agents: .}' \
            > out/manifest.json
          echo "--- manifest.json ---"
          cat out/manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-skills
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET || 'salto-saas-cli' }}
      S3_PREFIX: ${{ vars.S3_PREFIX || 'salto-agent-plugin' }}
    steps:
      - name: Verify required config
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${S3_BUCKET:?Set the S3_BUCKET repository variable}"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-skills
          path: out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3 (versioned + latest)
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version out/manifest.json)
          base="s3://${S3_BUCKET}/${S3_PREFIX}"
          echo "Publishing version ${VERSION} to ${base}/{${VERSION},latest}/"
          for f in out/*.zip out/manifest.json; do
            name=$(basename "$f")
            aws s3 cp "$f" "${base}/${VERSION}/${name}"
            aws s3 cp "$f" "${base}/latest/${name}"
          done
          echo "Done."
